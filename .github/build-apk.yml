name: Build APK (Manual)

# Yeh workflow manually trigger hota hai
# GitHub par jao: Actions tab → "Build APK (Manual)" → "Run workflow" button
on:
  workflow_dispatch:
    inputs:
      test_url:
        description: 'Local test URL (e.g. http://192.168.1.5:3001). Khali chhodne par code ka default use hoga.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # release banane ke liye

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Update test URL (if provided)
        if: ${{ github.event.inputs.test_url != '' }}
        run: |
          sed -i "s|private baseUrlTestMode = .*|private baseUrlTestMode = '${{ github.event.inputs.test_url }}';|" src/lib/services/ExtensionManager.ts
          echo "✅ Test URL updated to: ${{ github.event.inputs.test_url }}"
          grep -A1 "private testMode" src/lib/services/ExtensionManager.ts | head -3

      - name: Expo prebuild (clean generate android folder)
        run: npx expo prebuild -p android --clean --no-install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Copy debug keystore
        run: cp debug.keystore android/app/debug.keystore || true

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vega-app-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Vega Build #${{ github.run_number }}"
          body: |
            Vega APK build (testMode enabled)
            Test URL: ${{ github.event.inputs.test_url || '(default in code)' }}
            Commit: ${{ github.sha }}
          files: ${{ steps.find_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
